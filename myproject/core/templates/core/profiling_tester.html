<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiCT Profiling Tester</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background: #f4f7f6;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        .question-block {
            border-left: 5px solid #3498db;
            padding: 15px;
            margin-bottom: 25px;
            display: none;
        }

        .question-block.active {
            display: block;
        }

        .btn {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .options-list li {
            margin: 10px 0;
        }

        .result {
            font-weight: bold;
            color: #e67e22;
            font-size: 24px;
            text-align: center;
            margin-top: 20px;
        }

        img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .upload-section {
            background: #fff;
            padding: 20px;
            border: 2px dashed #3498db;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>LogiCT Profiling Tester 🧪</h1>

    <div class="upload-section">
        <h3>1. Upload Soal (CSV)</h3>
        <input type="file" id="csvFile" accept=".csv">
        <button class="btn" onclick="uploadCSV()">Upload CSV</button>
        <p id="uploadStatus"></p>
    </div>

    <div class="card" id="quizContainer">
        <h3>2. Simulasi Quiz</h3>
        <button class="btn" onclick="startQuiz()">Load & Start Quiz</button>
        <div id="quizContent"></div>
    </div>

    <div id="resultCard" class="card" style="display: none;">
        <h3>3. Hasil Profiling</h3>
        <p>Hasil Anda adalah:</p>
        <div id="finalCode" class="result"></div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let userResponses = [];

        async function uploadCSV() {
            const fileInput = document.getElementById('csvFile');
            if (!fileInput.files[0]) return alert("Pilih file CSV dulu!");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const response = await fetch('/api/profiling/upload-csv/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCookie('csrftoken') },
                body: formData
            });

            const result = await response.json();
            document.getElementById('uploadStatus').innerText = result.message || result.error;
        }

        async function startQuiz() {
            const response = await fetch('/api/profiling/questions/');
            questions = await response.json();
            if (questions.length === 0) return alert("Belum ada soal! Upload CSV dulu.");

            currentIndex = 0;
            userResponses = [];
            document.getElementById('quizContent').innerHTML = '';
            showQuestion();
        }

        function showQuestion() {
            if (currentIndex >= questions.length) {
                renderSubmitButton();
                return;
            }

            const q = questions[currentIndex];
            let html = `<div class="question-block active">
                <p><strong>Soal ${currentIndex + 1} of ${questions.length}</strong> (${q.category})</p>
                <p>${q.question}</p>`;

            if (q.image) {
                html += `<img src="${q.image}" alt="Question Image">`;
            }

            if (q.type === 'multiple_choice' || q.type === 'multiple_choice_image' || q.type === 'multi_select' || q.type === 'multi_select_image') {
                const isMulti = q.type.startsWith('multi_select');
                const inputType = isMulti ? 'checkbox' : 'radio';

                html += `<ul class="options-list">`;
                q.option.forEach(opt => {
                    if (q.type.includes('_image')) {
                        const imgSrc = opt.startsWith('http') ? opt : `/media/questions/${opt}`;
                        html += `<li><label>
                            <input type="${inputType}" name="q_ans" value="${opt}">
                            <div style="display: inline-block; vertical-align: middle; margin-left: 10px;">
                                <img src="${imgSrc}" style="max-width: 150px; display: block; margin: 5px 0;">
                                <small>${opt}</small>
                            </div>
                        </label></li>`;
                    } else {
                        html += `<li><label><input type="${inputType}" name="q_ans" value="${opt}"> ${opt}</label></li>`;
                    }
                });
                html += `</ul>`;
            } else if (q.type === 'scale') {
                html += `<p>Skala (1-6): <input type="number" id="q_ans_num" min="1" max="6" value="3"></p>`;
            } else {
                html += `<p><input type="text" id="q_ans_text" placeholder="Jawaban..."></p>`;
            }

            html += `<button class="btn" onclick="nextQuestion()">Next</button></div>`;
            document.getElementById('quizContent').innerHTML = html;
        }

        function nextQuestion() {
            const q = questions[currentIndex];
            let answer = "";

            if (q.type.includes('multiple_choice') || q.type.includes('multi_select')) {
                const selected = document.querySelectorAll('input[name="q_ans"]:checked');
                if (selected.length === 0) return alert("Pilih jawaban!");

                if (q.type.startsWith('multi_select')) {
                    answer = Array.from(selected).map(el => el.value).join('|');
                } else {
                    answer = selected[0].value;
                }
            } else if (q.type === 'scale') {
                answer = document.getElementById('q_ans_num').value;
            } else {
                answer = document.getElementById('q_ans_text').value;
            }

            userResponses.push({ question_id: q.id, answer: answer });
            currentIndex++;
            showQuestion();
        }

        function renderSubmitButton() {
            document.getElementById('quizContent').innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <p>Semua soal selesai dijawab!</p>
                    <button class="btn btn-success" onclick="submitQuiz()">Submit & Lihat Hasil</button>
                </div>
            `;
        }

        async function submitQuiz() {
            const response = await fetch('/api/profiling/submit/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ responses: userResponses })
            });

            const result = await response.json();
            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('finalCode').innerText = result.result_code;
            document.getElementById('quizContainer').style.display = 'none';
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>

</html>
